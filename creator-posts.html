<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>投稿一覧 | ura-post.com</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
<script src="https://cdn.tailwindcss.com"></script>
<!-- 視聴ページ(index.html)と同じバナー広告用(ExoClick AdProvider) -->
<script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-teal:#7fccc0;
    --accent-teal-dark:#4a9d90;
    --bg-page:#faf3ea;
  }
  html,body{
    background:var(--bg-page);
    font-family:'Noto Sans JP',sans-serif;
  }
  .card{
    background:#ffffff;
    border:1px solid #efe6d8;
    box-shadow:0 4px 20px rgba(120,90,50,0.08);
  }
  .btn-primary{
    background:linear-gradient(180deg,var(--accent-teal),var(--accent-teal-dark));
    color:#ffffff;
  }
  /* 「気になる」「トップに戻る」用。視聴ページ(index.html)と同じ見た目にしてある。 */
  .btn-secondary-cta{
    background:linear-gradient(180deg,var(--accent-teal),var(--accent-teal-dark));
    color:#ffffff;
    box-shadow:0 4px 14px rgba(74,157,144,0.3);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-secondary-cta:active{ transform:scale(0.98); }
  .btn-secondary-cta:hover{ box-shadow:0 6px 18px rgba(74,157,144,0.4); }
  .brand{
    font-family:'Outfit','Noto Sans JP',sans-serif;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .brand-accent{
    color:var(--accent-teal-dark);
  }
</style>
</head>
<body class="min-h-screen w-full p-4" style="background:var(--bg-page);">

<!-- 年齢確認ゲート。index.htmlと同じ挙動(一度「はい」を選ぶとlocalStorageに記録) -->
<div id="ageGateOverlay" class="fixed inset-0 z-[100] flex items-center justify-center p-4" style="background:var(--bg-page);">
  <div class="card rounded-2xl p-6 max-w-sm w-full text-center flex flex-col gap-4">
    <p class="text-sm font-bold text-slate-700">当サイトはアダルトコンテンツを含みます</p>
    <p class="text-xs text-slate-400">18歳未満の方のご利用はお断りしております。あなたは18歳以上ですか？</p>
    <div class="flex gap-2">
      <button id="ageGateYes" type="button" class="btn-primary flex-1 rounded-xl py-3 text-sm font-bold">
        はい（18歳以上です）
      </button>
      <button id="ageGateNo" type="button" class="flex-1 border border-slate-200 text-slate-500 rounded-xl py-3 text-sm font-medium hover:bg-slate-50">
        いいえ
      </button>
    </div>
  </div>
</div>

<div class="w-full max-w-md mx-auto flex flex-col gap-4 py-4">
  <div>
    <h1 class="brand text-xl"><span class="text-slate-800">URA-POST</span><span class="brand-accent">.COM</span></h1>
    <p class="text-xs text-slate-400 mt-1">この投稿者の投稿一覧</p>
  </div>

  <!-- 視聴ページの「この投稿者の投稿一覧を見る」から来た場合、このページに戻る/他へ移動する
       手段が無いと行き止まりになるため追加。一覧(postsGrid)が長くなっても迷わないよう、
       スクロールしなくて済む位置(グリッドより上)に置く。 -->
  <div class="flex flex-col gap-2">
    <a
      id="interestedBtn"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      class="hidden-el btn-secondary-cta w-full text-center py-3 rounded-xl text-sm font-bold block"
    >
      👀 この子が気になる 👀
    </a>
    <a
      id="homeLinkBtn"
      href="/"
      class="btn-secondary-cta w-full text-center py-3 rounded-xl text-sm font-bold block"
    >
      🏠 他の投稿ももっと見る 🏠
    </a>
  </div>

  <!-- 視聴ページと同じバナー広告。PC/スマホでゾーンID・タグが異なるため、判定した方の
       <ins>だけを生成する(index.html/top.htmlと同じ方式)。 -->
  <div id="creatorPostsAdWrap" class="hidden-el w-full flex justify-center"></div>

  <div id="loadingText" class="text-sm text-slate-400">読み込み中…</div>
  <div id="emptyText" class="hidden-el text-sm text-slate-400">投稿が見つかりませんでした。</div>
  <div id="postsGrid" class="grid grid-cols-3 gap-2"></div>
</div>

<script>
(function () {
  const ageGateOverlay = document.getElementById('ageGateOverlay');
  const ageGateYes = document.getElementById('ageGateYes');
  const ageGateNo = document.getElementById('ageGateNo');

  if (localStorage.getItem('ageVerified') === '1') {
    ageGateOverlay.style.display = 'none';
  }
  ageGateYes.addEventListener('click', () => {
    localStorage.setItem('ageVerified', '1');
    ageGateOverlay.style.display = 'none';
  });
  ageGateNo.addEventListener('click', () => {
    location.href = 'https://www.google.com/';
  });

  const creatorId = {{CREATOR_ID_JSON}};
  const creatorDisplayName = {{CREATOR_DISPLAY_NAME_JSON}};
  const creatorContactUrl = {{CREATOR_CONTACT_URL_JSON}};
  const loadingText = document.getElementById('loadingText');
  const emptyText = document.getElementById('emptyText');
  const postsGrid = document.getElementById('postsGrid');
  const creatorPostsAdWrap = document.getElementById('creatorPostsAdWrap');
  const interestedBtn = document.getElementById('interestedBtn');
  const CONTENT_PAGE_AD_DESKTOP_QUERY = '(min-width: 768px)';

  // 投稿者の連絡先URL(SNS等)が設定されている場合のみ「気になる」ボタンを表示する
  // (視聴ページのinterestedBtnと同じ扱い)。
  if (creatorContactUrl) {
    interestedBtn.href = creatorContactUrl;
    interestedBtn.classList.remove('hidden-el');
  }

  fetch('/site-config', { cache: 'no-store' })
    .then((res) => res.json())
    .then((info) => {
      const isDesktopAd = window.matchMedia(CONTENT_PAGE_AD_DESKTOP_QUERY).matches;
      const zoneId = isDesktopAd ? info.contentPageAdZoneIdDesktop : info.contentPageAdZoneIdMobile;
      if (!zoneId) return;
      const ins = document.createElement('ins');
      ins.className = isDesktopAd ? 'eas6a97888e2' : 'eas6a97888e10';
      ins.setAttribute('data-zoneid', zoneId);
      creatorPostsAdWrap.innerHTML = '';
      creatorPostsAdWrap.appendChild(ins);
      creatorPostsAdWrap.classList.remove('hidden-el');
      (window.AdProvider = window.AdProvider || []).push({ serve: {} });
    })
    .catch(() => {});

  fetch('/api/creator-posts?creatorId=' + encodeURIComponent(creatorId), { cache: 'no-store' })
    .then((res) => res.json())
    .then((data) => {
      loadingText.classList.add('hidden-el');
      const items = (data && data.items) || [];
      if (!items.length) {
        emptyText.classList.remove('hidden-el');
        return;
      }
      items.forEach((item) => {
        const link = document.createElement('a');
        link.href = '/?v=' + encodeURIComponent(item.id);
        link.className = 'block aspect-square rounded-lg overflow-hidden bg-gray-100 relative';

        const img = document.createElement('img');
        img.src = item.thumbnailUrl || '/og-image';
        img.loading = 'lazy';
        img.className = 'w-full h-full object-cover';
        // サムネイルのalt文言。画像検索等での発見可能性のため、分かる範囲で内容を説明する。
        img.alt = creatorDisplayName
          ? creatorDisplayName + 'さんの' + (item.contentType === 'image' ? '画像' : '動画') + '投稿'
          : (item.contentType === 'image' ? '画像' : '動画') + '投稿のサムネイル';
        link.appendChild(img);

        const badge = document.createElement('span');
        badge.className = 'absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded';
        badge.textContent = item.contentType === 'image' ? '画像' : '動画';
        link.appendChild(badge);

        postsGrid.appendChild(link);
      });
    })
    .catch(() => {
      loadingText.classList.add('hidden-el');
      emptyText.classList.remove('hidden-el');
    });
})();
</script>

<style>
  .hidden-el{ display:none !important; }
</style>

</body>
</html>
