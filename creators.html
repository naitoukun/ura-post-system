<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<!-- top.htmlと同じく、一般公開する段になったら外す想定 -->
<meta name="robots" content="noindex, nofollow">
<title>投稿者一覧 | ura-post.com</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-teal:#7fccc0;
    --accent-teal-dark:#4a9d90;
    --bg-page:#faf3ea;
  }
  html,body{
    background:var(--bg-page);
    font-family:'Noto Sans JP',sans-serif;
  }
  .card{
    background:#ffffff;
    border:1px solid #efe6d8;
    box-shadow:0 4px 20px rgba(120,90,50,0.08);
  }
  .brand{
    font-family:'Outfit','Noto Sans JP',sans-serif;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .brand-accent{
    color:var(--accent-teal-dark);
  }
</style>
</head>
<body class="min-h-screen w-full p-4" style="background:var(--bg-page);">

<div class="w-full max-w-md mx-auto flex flex-col gap-4 py-4">
  <div>
    <a href="/" class="text-xs font-bold text-teal-700 hover:underline">← TOPに戻る</a>
    <h1 class="brand text-xl mt-2"><span class="text-slate-800">URA-POST</span><span class="brand-accent">.COM</span></h1>
    <p class="text-xs text-slate-500 font-medium mt-1">投稿者一覧（投稿頻度に関係なく全員表示）</p>
  </div>

  <div id="loadingText" class="text-sm text-slate-400">読み込み中…</div>
  <div id="emptyText" class="hidden-el text-sm text-slate-400">投稿者が見つかりませんでした。</div>
  <div id="creatorsList" class="flex flex-col gap-2"></div>

  <!-- フッター（サイト実態と一致する表記。index.htmlと同じもの） -->
  <footer class="mt-4 text-center text-[11px] text-gray-400">
    <p>当サイトは動画広告視聴型のリワードコンテンツゲートです。</p>
    <p>
      <a href="/terms" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">利用規約</a> |
      <a href="/disclaimer" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">免責事項</a> |
      <a href="/copyright-policy" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">著作権ポリシー</a> |
      <a href="https://x.com/urapost_info" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">お問い合わせ</a>
    </p>
  </footer>
</div>

<script>
(function () {
  const loadingText = document.getElementById('loadingText');
  const emptyText = document.getElementById('emptyText');
  const creatorsList = document.getElementById('creatorsList');

  fetch('/api/creators-list', { cache: 'no-store' })
    .then((res) => res.json())
    .then((data) => {
      loadingText.classList.add('hidden-el');
      const items = (data && data.items) || [];
      if (!items.length) {
        emptyText.classList.remove('hidden-el');
        return;
      }
      items.forEach((item) => {
        const row = document.createElement('a');
        row.href = '/creator-posts/' + encodeURIComponent(item.id);
        row.className = 'card rounded-2xl p-4 flex items-center justify-between gap-2';

        const name = document.createElement('span');
        name.className = 'text-sm font-bold text-slate-700 truncate';
        name.textContent = item.displayName;
        row.appendChild(name);

        const count = document.createElement('span');
        count.className = 'text-xs text-slate-400 shrink-0';
        count.textContent = item.postCount + '件';
        row.appendChild(count);

        creatorsList.appendChild(row);
      });
    })
    .catch(() => {
      loadingText.classList.add('hidden-el');
      emptyText.classList.remove('hidden-el');
    });
})();
</script>

<style>
  .hidden-el{ display:none !important; }
</style>

</body>
</html>
