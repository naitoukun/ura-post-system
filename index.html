<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Secret Viewer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-teal:#14b8a6;
    --accent-teal-dark:#0d9488;
    --accent-coral:#fb7185;
    --accent-coral-dark:#f43f5e;
    --bg-page:#f4f7fa;
  }
  html,body{
    background:var(--bg-page);
    font-family:'Noto Sans JP',sans-serif;
    overscroll-behavior:none;
  }

  .card{
    background:#ffffff;
    border:1px solid #e7edf3;
    box-shadow:0 4px 20px rgba(15,45,60,0.06);
  }

  .btn-primary{
    background:linear-gradient(180deg,var(--accent-teal),var(--accent-teal-dark));
    color:#ffffff;
    box-shadow:0 6px 16px rgba(20,184,166,0.35);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:hover{ box-shadow:0 8px 20px rgba(20,184,166,0.45); }
  .btn-primary:disabled{ opacity:.6; }

  @keyframes soft-pulse{
    0%,100%{ box-shadow:0 6px 16px rgba(244,63,94,0.28); transform:scale(1); }
    50%{ box-shadow:0 8px 22px rgba(244,63,94,0.4); transform:scale(1.015); }
  }
  .btn-premium{
    animation:soft-pulse 2.4s ease-in-out infinite;
    background:linear-gradient(180deg,var(--accent-coral),var(--accent-coral-dark));
    color:#ffffff;
  }

  @keyframes breathe{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.06); }
  }
  .icon-breathe{ animation:breathe 2.6s ease-in-out infinite; }

  @keyframes indeterminate-progress{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(250%); }
  }
  .progress-bar-inner{
    width:40%;
    background:linear-gradient(90deg,var(--accent-teal),var(--accent-teal-dark));
    animation:indeterminate-progress 1.4s ease-in-out infinite;
  }

  .hidden-el{ display:none !important; }

  #overlay{
    background:rgba(244,247,250,0.92);
    backdrop-filter:blur(6px);
  }

  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  .spin{ animation:spin 1s linear infinite; }

  .brand{
    font-family:'Outfit','Noto Sans JP',sans-serif;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .brand-accent{
    color:var(--accent-teal-dark);
  }
</style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4">

<div class="w-full max-w-md mx-auto flex flex-col items-center gap-5 py-6">

  <!-- タイトル -->
  <div class="flex flex-col items-center gap-1">
    <h1 class="brand text-3xl sm:text-4xl text-slate-800 text-center whitespace-nowrap">
      Secret<span class="brand-accent">Viewer</span>
    </h1>
    <p class="text-xs text-slate-400 tracking-wide">広告視聴でコンテンツをアンロック</p>
  </div>

  <!-- ロック中エリア -->
  <div id="lockedArea" class="w-full flex flex-col items-center gap-5">

    <!-- 動画プレビュー枠 -->
    <div class="card relative w-full aspect-video rounded-2xl overflow-hidden flex items-center justify-center">
      <div class="absolute inset-0 bg-gradient-to-br from-slate-50 to-slate-100"></div>

      <svg class="icon-breathe relative w-16 h-16 sm:w-20 sm:h-20 text-teal-500" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C9.24 2 7 4.24 7 7V10H6C4.9 10 4 10.9 4 12V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V12C20 10.9 19.1 10 18 10H17V7C17 4.24 14.76 2 12 2ZM12 4C13.66 4 15 5.34 15 7V10H9V7C9 5.34 10.34 4 12 4ZM12 14C13.1 14 14 14.9 14 16C14 17.1 13.1 18 12 18C10.9 18 10 17.1 10 16C10 14.9 10.9 14 12 14Z" fill="currentColor"/>
      </svg>

      <span class="absolute bottom-3 right-4 text-[11px] text-slate-400 font-medium">ロック中</span>
    </div>

    <!-- 解除ボタン -->
    <button id="unlockBtn" class="btn-primary w-full py-4 rounded-xl text-base sm:text-lg font-bold tracking-wide">
      ▶ ビデオ広告を視聴してロック解除
    </button>
  </div>

  <!-- アンロック後エリア -->
  <div id="unlockedArea" class="hidden-el w-full flex flex-col items-center gap-4">
    <video
      id="mainVideo"
      class="card w-full rounded-2xl"
      controls
      autoplay
      playsinline
    ></video>

    <a
      id="premiumLink"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      class="btn-premium w-full text-center py-4 rounded-xl text-base sm:text-lg font-bold tracking-wide block"
    >
      続きをプレミアム会場（Fantia）で見る
    </a>
  </div>

  <!-- フッター（サイト実態と一致する表記） -->
  <footer class="mt-4 text-center text-[11px] text-gray-400">
    当サイトは動画広告視聴型のリワードコンテンツゲートです。
    <a href="#" class="underline hover:text-gray-500">利用規約</a> |
    <a href="#" class="underline hover:text-gray-500">免責事項</a>
  </footer>
</div>

<!-- 広告シミュレーション用オーバーレイ -->
<div id="overlay" class="hidden-el fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 px-6">
  <svg class="spin w-10 h-10 text-teal-500" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="42 100"/>
  </svg>
  <p class="text-lg sm:text-xl font-bold text-slate-700 text-center">
    広告読み込み中…
  </p>
  <div class="w-full max-w-xs h-2.5 rounded-full bg-slate-200 overflow-hidden">
    <div class="progress-bar-inner h-full"></div>
  </div>
  <p class="text-slate-400 text-xs">Loading Ad SDK (Dev Simulation)</p>
</div>

<script>
(function () {
  const unlockBtn   = document.getElementById('unlockBtn');
  const lockedArea  = document.getElementById('lockedArea');
  const unlockedArea= document.getElementById('unlockedArea');
  const overlay     = document.getElementById('overlay');
  const mainVideo   = document.getElementById('mainVideo');
  const premiumLink = document.getElementById('premiumLink');

  // 開発シミュレーション用の待機時間（実際の広告は尺が広告ごとに異なり、
  // 終了タイミングはSDK側のコールバックで通知されるため、秒数は画面には出さない）
  const DEV_SIMULATED_WAIT_MS = 5000;
  // 管理画面(/admin)からアップロードされた動画が無い場合のフォールバック
  const FALLBACK_VIDEO_URL = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
  // 管理画面(/admin)からリンクが設定されていない場合のフォールバック
  const FALLBACK_PREMIUM_LINK = 'https://fantia.jp/';
  // URLに ?v=<動画ID> が付いていれば、その動画を優先的に表示する
  // （個別のシェア用リンクを動画ごとに使い分けるため）。指定が無ければ最新の動画を表示する。
  const requestedVideoId = new URLSearchParams(location.search).get('v');

  // プレミアムリンクは誘導ボタン表示前に確定させておきたいため、
  // アンロックを待たずにページ読み込み時点で取得しておく
  loadPremiumLink();

  unlockBtn.addEventListener('click', startAdSimulation);

  function startAdSimulation() {
    unlockBtn.disabled = true;
    overlay.classList.remove('hidden-el');

    // TODO: 広告SDK実装時はここを書き換え
    // 実際のi-mobile等の広告SDKを組み込む場合は、
    // ここで広告表示APIを呼び出し、
    // 「広告視聴完了イベント（onAdCompleted等）」のコールバック内で
    // onAdFinished() を呼ぶ形に置き換える。広告の尺はSDK・広告ごとに
    // 異なりこちらでは制御できないため、終了はコールバック任せにする。
    // 以下は開発中の動作確認用にダミーの待機時間で代用している処理。
    setTimeout(onAdFinished, DEV_SIMULATED_WAIT_MS);
  }

  function onAdFinished() {
    // TODO: 広告SDK実装時はここを書き換え
    // 実際の広告終了コールバック（例：onAdCompleted, onAdClosed等）が
    // 発火したタイミングでこの関数を呼び出す形にする。
    overlay.classList.add('hidden-el');
    lockedArea.classList.add('hidden-el');
    unlockedArea.classList.remove('hidden-el');

    loadUploadedVideo();
  }

  function loadUploadedVideo() {
    const query = requestedVideoId ? '?v=' + encodeURIComponent(requestedVideoId) : '';
    fetch('/resolve-video' + query, { cache: 'no-store' })
      .then((res) => res.json())
      .then((status) => {
        mainVideo.src = status.exists
          ? '/video/' + status.id
          : FALLBACK_VIDEO_URL;
      })
      .catch(() => {
        mainVideo.src = FALLBACK_VIDEO_URL;
      })
      .finally(() => {
        mainVideo.play().catch(() => {
          // 自動再生がブラウザ側でブロックされた場合は
          // ユーザーの再生操作を待つ（controls属性で対応済み）
        });
      });
  }

  function loadPremiumLink() {
    fetch('/site-config', { cache: 'no-store' })
      .then((res) => res.json())
      .then((config) => {
        premiumLink.href = config.premiumLink || FALLBACK_PREMIUM_LINK;
      })
      .catch(() => {
        premiumLink.href = FALLBACK_PREMIUM_LINK;
      });
  }
})();
</script>

</body>
</html>
