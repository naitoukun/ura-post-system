<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="6a97888e-site-verification" content="c9e31b33bb13176de7f01e146423e5b6">
<title>ura-post.com</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Xアカウント(@urapost_info)のバナー・アイコンの配色(クリーム×ネイビー×ミント×ダスティピンク)に合わせたトーン */
    --accent-teal:#7fccc0;
    --accent-teal-dark:#4a9d90;
    --accent-coral:#f4a7bf;
    --accent-coral-dark:#e2799c;
    --bg-page:#faf3ea;
  }
  html,body{
    background:var(--bg-page);
    font-family:'Noto Sans JP',sans-serif;
    overscroll-behavior:none;
  }

  .card{
    background:#ffffff;
    border:1px solid #efe6d8;
    box-shadow:0 4px 20px rgba(120,90,50,0.08);
  }

  @keyframes soft-pulse-teal{
    0%,100%{ box-shadow:0 6px 16px rgba(74,157,144,0.35); transform:scale(1); }
    50%{ box-shadow:0 10px 26px rgba(74,157,144,0.55); transform:scale(1.02); }
  }
  .btn-primary{
    background:linear-gradient(180deg,var(--accent-teal),var(--accent-teal-dark));
    color:#ffffff;
    animation:soft-pulse-teal 2.2s ease-in-out infinite;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:hover{ box-shadow:0 8px 20px rgba(74,157,144,0.45); }
  .btn-primary:disabled{ animation:none; opacity:.6; }

  @keyframes soft-pulse{
    0%,100%{ box-shadow:0 6px 16px rgba(226,121,156,0.28); transform:scale(1); }
    50%{ box-shadow:0 8px 22px rgba(226,121,156,0.4); transform:scale(1.015); }
  }
  .btn-premium{
    animation:soft-pulse 2.4s ease-in-out infinite;
    background:linear-gradient(180deg,var(--accent-coral),var(--accent-coral-dark));
    color:#ffffff;
    transition:background .4s ease, box-shadow .4s ease;
  }
  /* 動画再生中は控えめなグレーにして、再生し終わった瞬間に目立つ色へ切り替える */
  .btn-premium.btn-muted{
    animation:none;
    background:#ece3d6;
    color:#a89a86;
    box-shadow:none;
  }

  @keyframes breathe{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.06); }
  }
  .icon-breathe{ animation:breathe 2.6s ease-in-out infinite; }

  .hidden-el{ display:none !important; }

  #overlay{
    background:rgba(250,243,234,0.92);
    backdrop-filter:blur(6px);
  }

  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  .spin{ animation:spin 1s linear infinite; }

  .brand{
    font-family:'Outfit','Noto Sans JP',sans-serif;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .brand-accent{
    color:var(--accent-teal-dark);
  }
</style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4">

<div class="w-full max-w-md mx-auto flex flex-col items-center gap-5 py-6">

  <!-- タイトル -->
  <div class="flex flex-col items-center gap-1">
    <h1 class="brand text-3xl sm:text-4xl text-slate-800 text-center whitespace-nowrap">
      URA-POST<span class="brand-accent">.COM</span>
    </h1>
    <p class="text-xs text-slate-400 tracking-wide">広告視聴でコンテンツをアンロック</p>
  </div>

  <!-- 期限切れエリア（24時間限定リンクが切れた場合） -->
  <div id="expiredArea" class="hidden-el w-full flex flex-col items-center gap-3 card rounded-2xl p-6 text-center">
    <svg class="w-10 h-10 text-slate-300" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 8V12L15 15M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="text-base font-bold text-slate-700">このリンクは期限切れです</p>
    <p class="text-sm text-slate-400">この動画リンクは、初回アクセスから24時間で視聴できなくなります。</p>
  </div>

  <!-- ロック中エリア -->
  <div id="lockedArea" class="w-full flex flex-col items-center gap-5">

    <!-- 24時間限定の場合のみ表示するカウントダウン -->
    <div id="countdownBanner" class="hidden-el w-full text-center text-xs font-medium text-amber-700 bg-amber-50 border border-amber-100 rounded-lg py-2">
      ⏱ 視聴期限まで残り <span id="countdownText">--:--:--</span>
    </div>

    <!-- 動画プレビュー枠（アップロード済み動画をモザイク処理してチラ見せ） -->
    <div class="card relative w-full aspect-video rounded-2xl overflow-hidden flex items-center justify-center">
      <div class="absolute inset-0 bg-gradient-to-br from-slate-50 to-slate-100"></div>

      <video id="teaserVideo" class="hidden" muted loop playsinline preload="auto"></video>
      <canvas id="teaserCanvas" class="absolute inset-0 w-full h-full"></canvas>

      <div class="relative z-10 w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-slate-900/45 backdrop-blur-sm flex items-center justify-center">
        <svg class="icon-breathe w-8 h-8 sm:w-10 sm:h-10 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C9.24 2 7 4.24 7 7V10H6C4.9 10 4 10.9 4 12V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V12C20 10.9 19.1 10 18 10H17V7C17 4.24 14.76 2 12 2ZM12 4C13.66 4 15 5.34 15 7V10H9V7C9 5.34 10.34 4 12 4ZM12 14C13.1 14 14 14.9 14 16C14 17.1 13.1 18 12 18C10.9 18 10 17.1 10 16C10 14.9 10.9 14 12 14Z" fill="currentColor"/>
        </svg>
      </div>

      <span class="absolute bottom-3 right-4 z-10 text-[11px] text-white font-medium drop-shadow">ロック中</span>
    </div>

    <!-- 解除ボタン -->
    <button id="unlockBtn" class="btn-primary w-full py-4 rounded-xl text-base sm:text-lg font-bold tracking-wide">
      ▶ ビデオ広告を視聴してロック解除
    </button>
  </div>

  <!-- アンロック後エリア -->
  <div id="unlockedArea" class="hidden-el w-full flex flex-col items-center gap-4">
    <video
      id="mainVideo"
      class="card w-full rounded-2xl"
      controls
      controlsList="nodownload noremoteplayback"
      disablePictureInPicture
      oncontextmenu="return false;"
      autoplay
      playsinline
    ></video>

    <a
      id="premiumLink"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      class="btn-premium btn-muted w-full text-center py-4 rounded-xl text-base sm:text-lg font-bold tracking-wide block"
    >
      ♥ 【ファン限定】Fantia特設ページへ ♥
    </a>
  </div>

  <!-- フッター（サイト実態と一致する表記） -->
  <footer class="mt-4 text-center text-[11px] text-gray-400">
    <p>当サイトは動画広告視聴型のリワードコンテンツゲートです。</p>
    <p>
      <a href="/terms" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">利用規約</a> |
      <a href="/disclaimer" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">免責事項</a> |
      <a href="/copyright-policy" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">著作権ポリシー</a> |
      <a href="https://x.com/urapost_info" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">お問い合わせ</a>
    </p>
  </footer>
</div>

<!-- 広告再生用オーバーレイ(Google IMA SDKでVASTタグを再生) -->
<div id="overlay" class="hidden-el fixed inset-0 z-50 flex flex-col items-center justify-center gap-4 px-4 sm:px-6">
  <div id="adPlayerWrap" class="relative w-full max-w-md aspect-video bg-black rounded-xl overflow-hidden">
    <video id="adContentEl" class="absolute inset-0 w-full h-full" muted playsinline></video>
    <div id="adContainerEl" class="absolute inset-0"></div>

    <div id="adLoadingState" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-black/60">
      <svg class="spin w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="42 100"/>
      </svg>
      <p class="text-sm font-bold text-white text-center px-4">広告読み込み中…</p>
    </div>
  </div>
  <p id="selectedAdDebug" class="text-slate-300 text-[11px]"></p>
</div>

<script>
(function () {
  const unlockBtn   = document.getElementById('unlockBtn');
  const lockedArea  = document.getElementById('lockedArea');
  const expiredArea = document.getElementById('expiredArea');
  const unlockedArea= document.getElementById('unlockedArea');
  const overlay     = document.getElementById('overlay');
  const mainVideo   = document.getElementById('mainVideo');
  const premiumLink = document.getElementById('premiumLink');
  const teaserVideo = document.getElementById('teaserVideo');
  const teaserCanvas= document.getElementById('teaserCanvas');
  const selectedAdDebug = document.getElementById('selectedAdDebug');
  const countdownBanner = document.getElementById('countdownBanner');
  const countdownText   = document.getElementById('countdownText');
  const adPlayerWrap  = document.getElementById('adPlayerWrap');
  const adContentEl   = document.getElementById('adContentEl');
  const adContainerEl = document.getElementById('adContainerEl');
  const adLoadingState= document.getElementById('adLoadingState');

  // 広告コードが未設定、またはVASTタグがエラー/フィル無しだった場合のフォールバック待機時間
  // （実際の広告は尺が広告ごとに異なり、終了タイミングはSDK側のコールバックで通知されるため、
  // 通常はここに来ない。あくまで広告が出せない時に視聴者を待たせすぎないための保険）。
  const NO_AD_FALLBACK_WAIT_MS = 3000;
  // 管理画面(/admin)からアップロードされた動画が無い場合のフォールバック
  const FALLBACK_VIDEO_URL = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
  // 管理画面(/admin)からリンクが設定されていない場合のフォールバック
  const FALLBACK_PREMIUM_LINK = 'https://fantia.jp/';
  // 管理画面(/admin)からボタンの文字が設定されていない場合のフォールバック
  const FALLBACK_PREMIUM_BUTTON_TEXT = '【ファン限定】Fantia特設ページへ';
  // URLに ?v=<動画ID> が付いていれば、その動画を優先的に表示する
  // （個別のシェア用リンクを動画ごとに使い分けるため）。指定が無ければ最新の動画を表示する。
  const requestedVideoId = new URLSearchParams(location.search).get('v');
  // モザイクの粗さ（横方向のブロック数）。小さいほど粗いモザイクになる。
  const MOSAIC_COLUMNS = 18;
  // 管理画面(/admin)で広告A/Bが設定されていない場合のフォールバック（1本だけ・100%表示）
  const FALLBACK_ADS = [{ id: 'fallback', label: 'デフォルト広告', adCode: '', weight: 100 }];

  // 広告A/B設定（この動画専用の個別設定 or サイト全体の既定設定）。
  // /resolve-video の取得が完了するまではフォールバックを使う
  let siteAds = FALLBACK_ADS;

  // 本編動画のURL・広告A/B設定・誘導ボタンのリンク先/文字は、この動画専用の
  // 個別設定(出演者名+Fantia URL)が無ければサイト全体の既定値になる。
  // ロック中のモザイク表示とアンロック後の本編再生・ボタン表示で共通して使うので、
  // ページ読み込み時に一度だけ解決してキャッシュしておく
  const videoInfoPromise = resolveVideo();
  videoInfoPromise.then((info) => {
    if (info.expired) {
      lockedArea.classList.add('hidden-el');
      expiredArea.classList.remove('hidden-el');
      return;
    }
    siteAds = (info.ads && info.ads.length) ? info.ads : FALLBACK_ADS;
    startTeaserPreview(info.url);

    premiumLink.href = info.premiumLink || FALLBACK_PREMIUM_LINK;
    premiumLink.textContent = '♥ ' + (info.premiumButtonText || FALLBACK_PREMIUM_BUTTON_TEXT) + ' ♥';

    if (info.timeLimit && info.timeLimit.enabled && info.timeLimit.expiresAtEpoch) {
      startCountdown(info.timeLimit.expiresAtEpoch);
    }
  });

  // 24時間限定の残り時間を1秒ごとに更新表示する。0になったら「期限切れ」画面に切り替える。
  function startCountdown(expiresAtEpoch) {
    countdownBanner.classList.remove('hidden-el');
    const expiresAtMs = expiresAtEpoch * 1000;

    const tick = () => {
      const remainingMs = expiresAtMs - Date.now();
      if (remainingMs <= 0) {
        clearInterval(intervalId);
        stopTeaserPreview();
        lockedArea.classList.add('hidden-el');
        expiredArea.classList.remove('hidden-el');
        return;
      }
      const totalSeconds = Math.floor(remainingMs / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      countdownText.textContent =
        String(hours).padStart(2, '0') + ':' +
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0');
    };

    tick();
    const intervalId = setInterval(tick, 1000);
  }

  unlockBtn.addEventListener('click', startAdSimulation);

  // Google IMA SDK (VASTタグを再生する業界標準のSDK) 関連。
  // 一度だけ作っておき、視聴のたびにrequestAds()し直す。
  let adDisplayContainer = null;
  let adsLoader = null;
  let adsManager = null;
  // CONTENT_RESUME_REQUESTED / ALL_ADS_COMPLETED / エラー等、複数の経路から
  // 二重にonAdFinished()が呼ばれないようにするフラグ
  let adFinishedCalled = false;

  function setUpIma() {
    if (adsLoader || typeof google === 'undefined' || !google.ima) return;
    adDisplayContainer = new google.ima.AdDisplayContainer(adContainerEl, adContentEl);
    adsLoader = new google.ima.AdsLoader(adDisplayContainer);

    adsLoader.addEventListener(
      google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,
      onAdsManagerLoaded,
      false
    );
    adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError, false);
  }

  function onAdsManagerLoaded(adsManagerLoadedEvent) {
    adsManager = adsManagerLoadedEvent.getAdsManager(adContentEl);

    adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError);
    adsManager.addEventListener(google.ima.AdEvent.Type.LOADED, () => {
      adLoadingState.classList.add('hidden-el');
    });
    adsManager.addEventListener(google.ima.AdEvent.Type.CONTENT_RESUME_REQUESTED, onAdFinished);
    adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, onAdFinished);

    try {
      adsManager.init(adPlayerWrap.clientWidth, adPlayerWrap.clientHeight, google.ima.ViewMode.NORMAL);
      adsManager.start();
    } catch (adError) {
      onAdError();
    }
  }

  function onAdError() {
    if (adsManager) adsManager.destroy();
    // VASTタグがエラー/フィル無しだった場合は、視聴者を待たせすぎずそのままアンロックする
    setTimeout(onAdFinished, NO_AD_FALLBACK_WAIT_MS);
  }

  function startAdSimulation() {
    unlockBtn.disabled = true;
    adFinishedCalled = false;
    overlay.classList.remove('hidden-el');
    adLoadingState.classList.remove('hidden-el');

    // 管理画面(/admin)の「広告A/B設定」の比率にもとづき、表示する広告を抽選する
    const selectedAd = pickWeightedAd(siteAds);
    selectedAdDebug.textContent = '';

    if (!selectedAd.adCode || typeof google === 'undefined' || !google.ima) {
      // 広告コード未設定、またはSDKが読み込めていない場合はそのままアンロックする
      setTimeout(onAdFinished, NO_AD_FALLBACK_WAIT_MS);
      return;
    }

    setUpIma();
    if (!adsLoader) {
      setTimeout(onAdFinished, NO_AD_FALLBACK_WAIT_MS);
      return;
    }

    // AdDisplayContainer.initialize()はユーザー操作(クリック)の呼び出し経路内で
    // 呼ぶ必要がある(モバイルSafari等の自動再生制限を回避するため)
    adDisplayContainer.initialize();

    const adsRequest = new google.ima.AdsRequest();
    adsRequest.adTagUrl = selectedAd.adCode;
    adsRequest.linearAdSlotWidth = adPlayerWrap.clientWidth;
    adsRequest.linearAdSlotHeight = adPlayerWrap.clientHeight;
    adsRequest.nonLinearAdSlotWidth = adPlayerWrap.clientWidth;
    adsRequest.nonLinearAdSlotHeight = Math.round(adPlayerWrap.clientHeight / 3);

    adsLoader.requestAds(adsRequest);
  }

  // weight（重み）に応じた確率で、ads配列から1つを抽選する。
  // 例: weight 70 / 30 の2件なら、約70%/30%の確率でそれぞれ選ばれる。
  function pickWeightedAd(ads) {
    const totalWeight = ads.reduce((sum, ad) => sum + ad.weight, 0);
    if (totalWeight <= 0) return ads[0];

    let roll = Math.random() * totalWeight;
    for (const ad of ads) {
      roll -= ad.weight;
      if (roll < 0) return ad;
    }
    return ads[ads.length - 1];
  }

  function onAdFinished() {
    if (adFinishedCalled) return;
    adFinishedCalled = true;
    overlay.classList.add('hidden-el');
    lockedArea.classList.add('hidden-el');
    unlockedArea.classList.remove('hidden-el');

    stopTeaserPreview();

    // 再生中はボタンを目立たせず、動画が最後まで再生され終わった瞬間に
    // 目立つ色（既存のパルスアニメーション）へ切り替える。視聴後の一番
    // 「次の行動を探している」タイミングで注目を集めるための演出。
    premiumLink.classList.add('btn-muted');
    mainVideo.addEventListener('ended', () => {
      premiumLink.classList.remove('btn-muted');
    }, { once: true });

    videoInfoPromise.then((info) => {
      mainVideo.src = info.url;
      mainVideo.play().catch(() => {
        // 自動再生がブラウザ側でブロックされた場合は
        // ユーザーの再生操作を待つ（controls属性で対応済み）
      });
    });
  }

  // 動画URLと、その動画に紐づく広告A/B設定（個別設定 or サイト既定）をまとめて解決する。
  // 24時間限定の動画で期限切れの場合は expired:true を返す。
  function resolveVideo() {
    const query = requestedVideoId ? '?v=' + encodeURIComponent(requestedVideoId) : '';
    return fetch('/resolve-video' + query, { cache: 'no-store' })
      .then((res) => res.json())
      .then((status) => {
        if (status.exists && status.expired) {
          return { expired: true };
        }
        return {
          expired: false,
          url: status.exists ? '/video/' + status.id : FALLBACK_VIDEO_URL,
          ads: status.exists ? status.ads : null,
          timeLimit: status.exists ? status.timeLimit : null,
          premiumLink: status.exists ? status.premiumLink : null,
          premiumButtonText: status.exists ? status.premiumButtonText : null,
        };
      })
      .catch(() => ({
        expired: false,
        url: FALLBACK_VIDEO_URL,
        ads: null,
        timeLimit: null,
        premiumLink: null,
        premiumButtonText: null,
      }));
  }

  // ロック中の枠に、アップロード済み動画をモザイク処理してチラ見せする。
  // サーバー側では加工せず、<video>から読み取ったフレームをCanvas上で
  // 一旦小さく縮小してから引き伸ばして描画することでモザイク状に見せている。
  let mosaicRafId = null;
  const smallCanvas = document.createElement('canvas');
  const smallCtx = smallCanvas.getContext('2d');
  const teaserCtx = teaserCanvas.getContext('2d');
  teaserCtx.imageSmoothingEnabled = false;

  function startTeaserPreview(url) {
    teaserVideo.src = url;
    teaserVideo.play().catch(() => {
      // モバイルブラウザ等で自動再生がブロックされた場合は、
      // モザイク自体は静止画（初期フレーム）のままになる
    });
    syncCanvasSize();
    window.addEventListener('resize', syncCanvasSize);
    mosaicRafId = requestAnimationFrame(drawMosaicFrame);
  }

  function stopTeaserPreview() {
    if (mosaicRafId !== null) {
      cancelAnimationFrame(mosaicRafId);
      mosaicRafId = null;
    }
    window.removeEventListener('resize', syncCanvasSize);
    teaserVideo.pause();
  }

  function syncCanvasSize() {
    teaserCanvas.width = teaserCanvas.clientWidth;
    teaserCanvas.height = teaserCanvas.clientHeight;
  }

  function drawMosaicFrame() {
    if (teaserVideo.readyState >= 2 && teaserVideo.videoWidth) {
      const aspect = teaserVideo.videoHeight / teaserVideo.videoWidth;
      smallCanvas.width = MOSAIC_COLUMNS;
      smallCanvas.height = Math.max(1, Math.round(MOSAIC_COLUMNS * aspect));

      smallCtx.drawImage(teaserVideo, 0, 0, smallCanvas.width, smallCanvas.height);
      teaserCtx.drawImage(
        smallCanvas,
        0, 0, smallCanvas.width, smallCanvas.height,
        0, 0, teaserCanvas.width, teaserCanvas.height
      );
    }
    mosaicRafId = requestAnimationFrame(drawMosaicFrame);
  }

})();
</script>

</body>
</html>
