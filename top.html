<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<!-- 今は管理者ログイン中のみ表示されるプレビュー段階のページなので、念のため検索エンジンには
     インデックスさせない(一般公開する段になったら外す想定)。 -->
<meta name="robots" content="noindex, nofollow">
<title>ura-post.com</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- 視聴ページ(index.html)と同じバナー広告用(ExoClick AdProvider) -->
<script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>
<!-- アクセス解析(GoatCounter)。index.htmlと同じ計測 -->
<script data-goatcounter="https://ura-post.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<!-- アクセス解析(Google アナリティクス)。index.htmlと同じ計測 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NPZ33E313T"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NPZ33E313T');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-teal:#7fccc0;
    --accent-teal-dark:#4a9d90;
    --bg-page:#faf3ea;
  }
  html,body{
    background:var(--bg-page);
    font-family:'Noto Sans JP',sans-serif;
  }
  .card{
    background:#ffffff;
    border:1px solid #efe6d8;
    box-shadow:0 4px 20px rgba(120,90,50,0.08);
  }
  .btn-primary{
    background:linear-gradient(180deg,var(--accent-teal),var(--accent-teal-dark));
    color:#ffffff;
  }
  .brand{
    font-family:'Outfit','Noto Sans JP',sans-serif;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .brand-accent{
    color:var(--accent-teal-dark);
  }
  .type-filter-btn{
    border-color:var(--accent-teal);
    color:var(--accent-teal-dark);
    background:#ffffff;
  }
  .type-filter-btn.active{
    background:linear-gradient(180deg,var(--accent-teal),var(--accent-teal-dark));
    color:#ffffff;
  }
  /* ピックアップの横自動スクロール帯。transformのCSSアニメーションのみで動かす
     (JSでscrollLeftをポーリングするより軽く、GPUで処理されるためスマホでも滑らか)。
     中身は同じ並びを2セット並べておき、ちょうど半分(1セット分)だけ動かしたところで
     0に戻すことで、途切れなくループして見えるようにしている。 */
  .pickup-marquee-viewport{
    overflow:hidden;
  }
  .pickup-marquee-track{
    display:flex;
    gap:0.5rem;
    width:max-content;
    animation-name:pickup-marquee-scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes pickup-marquee-scroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  /* 「視差効果を減らす」設定のユーザーには自動で動かさず、指でスクロールできる帯として出す */
  @media (prefers-reduced-motion: reduce){
    .pickup-marquee-viewport{
      overflow-x:auto;
    }
    .pickup-marquee-track{
      animation:none;
    }
  }
</style>
</head>
<body class="min-h-screen w-full p-4" style="background:var(--bg-page);">

<!-- 年齢確認ゲート。index.htmlと同じ挙動(一度「はい」を選ぶとlocalStorageに記録) -->
<div id="ageGateOverlay" class="fixed inset-0 z-[100] flex items-center justify-center p-4" style="background:var(--bg-page);">
  <div class="card rounded-2xl p-6 max-w-sm w-full text-center flex flex-col gap-4">
    <p class="text-sm font-bold text-slate-700">当サイトはアダルトコンテンツを含みます</p>
    <p class="text-xs text-slate-400">18歳未満の方のご利用はお断りしております。あなたは18歳以上ですか？</p>
    <div class="flex gap-2">
      <button id="ageGateYes" type="button" class="btn-primary flex-1 rounded-xl py-3 text-sm font-bold">
        はい（18歳以上です）
      </button>
      <button id="ageGateNo" type="button" class="flex-1 border border-slate-200 text-slate-500 rounded-xl py-3 text-sm font-medium hover:bg-slate-50">
        いいえ
      </button>
    </div>
  </div>
</div>

<div class="w-full max-w-md mx-auto flex flex-col gap-4 py-4">
  <div class="card rounded-2xl p-5 flex flex-col items-center text-center gap-1.5">
    <h1 class="brand text-3xl"><span class="text-slate-800">URA-POST</span><span class="brand-accent">.COM</span></h1>
    <p class="text-sm font-bold text-slate-700 mt-1">Xで活動する女の子を応援するサイト💕</p>
    <p class="text-sm font-bold text-slate-700">限定画像や動画を多数掲載✨</p>
    <p class="text-sm font-bold text-slate-700">すべて無料で楽しめます🆓</p>
  </div>

  <!-- 視聴ページと同じバナー広告。PC/スマホでゾーンID・タグが異なるため、判定した方の
       <ins>だけを生成する(index.htmlと同じ方式)。 -->
  <div id="topAdWrap" class="hidden-el w-full"></div>

  <!-- 検索・絞り込み。タグ等の分類データは無いため、投稿者名の部分一致検索と
       種別(動画/画像)の絞り込みのみ。検索中はピックアップ枠を一旦隠す(結果と
       混ざると分かりにくいため)。 -->
  <div class="card rounded-2xl p-3 flex flex-col gap-2">
    <input
      id="searchInput"
      type="search"
      inputmode="search"
      placeholder="🔍 投稿者名で検索"
      class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400"
    >
    <div class="flex gap-2">
      <button type="button" data-type="" class="type-filter-btn flex-1 rounded-lg py-1.5 text-xs font-bold border">すべて</button>
      <button type="button" data-type="video" class="type-filter-btn flex-1 rounded-lg py-1.5 text-xs font-bold border">動画</button>
      <button type="button" data-type="image" class="type-filter-btn flex-1 rounded-lg py-1.5 text-xs font-bold border">画像</button>
    </div>
  </div>

  <!-- 埋もれ対策: 新着順とは別に、無作為に選んだ投稿を毎回出す枠(古い投稿にも光を当てる)。
       横自動スクロールの帯で目立たせる(prefers-reduced-motionでは静止表示に切り替え、
       指で触れている間は一時停止する)。 -->
  <div id="pickupSection" class="hidden-el flex flex-col gap-2">
    <p class="btn-primary text-base font-bold text-center rounded-xl py-2.5 shadow-sm">💎 ピックアップ 💎</p>
    <div class="pickup-marquee-viewport rounded-xl">
      <div id="pickupTrack" class="pickup-marquee-track"></div>
    </div>
  </div>

  <p id="feedHeading" class="btn-primary text-base font-bold text-center rounded-xl py-2.5 shadow-sm">🆕 新着 🆕</p>

  <div id="loadingText" class="text-sm text-slate-400">読み込み中…</div>
  <div id="emptyText" class="hidden-el text-sm text-slate-400">投稿が見つかりませんでした。</div>
  <div id="postsGrid" class="flex flex-col gap-4"></div>
  <!-- 無限スクロール用の目印。これが画面内に入ったら次のページを読み込む -->
  <div id="loadMoreSentinel" class="hidden-el text-center text-xs text-slate-400 py-2">読み込み中…</div>

  <!-- フッター（サイト実態と一致する表記。index.htmlと同じもの） -->
  <footer class="mt-4 text-center text-[11px] text-gray-400">
    <p>当サイトは動画広告視聴型のリワードコンテンツゲートです。</p>
    <p>
      <a href="/terms" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">利用規約</a> |
      <a href="/disclaimer" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">免責事項</a> |
      <a href="/copyright-policy" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">著作権ポリシー</a> |
      <a href="https://x.com/urapost_info" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-500">お問い合わせ</a>
    </p>
  </footer>
</div>

<script>
(function () {
  const ageGateOverlay = document.getElementById('ageGateOverlay');
  const ageGateYes = document.getElementById('ageGateYes');
  const ageGateNo = document.getElementById('ageGateNo');

  if (localStorage.getItem('ageVerified') === '1') {
    ageGateOverlay.style.display = 'none';
  }
  ageGateYes.addEventListener('click', () => {
    localStorage.setItem('ageVerified', '1');
    ageGateOverlay.style.display = 'none';
  });
  ageGateNo.addEventListener('click', () => {
    location.href = 'https://www.google.com/';
  });

  const loadingText = document.getElementById('loadingText');
  const emptyText = document.getElementById('emptyText');
  const postsGrid = document.getElementById('postsGrid');
  const pickupSection = document.getElementById('pickupSection');
  const pickupTrack = document.getElementById('pickupTrack');
  const loadMoreSentinel = document.getElementById('loadMoreSentinel');
  const topAdWrap = document.getElementById('topAdWrap');
  const feedHeading = document.getElementById('feedHeading');
  const searchInput = document.getElementById('searchInput');
  const typeFilterBtns = Array.from(document.querySelectorAll('.type-filter-btn'));
  const CONTENT_PAGE_AD_DESKTOP_QUERY = '(min-width: 768px)';
  const PAGE_SIZE = 20;

  // ピックアップ枠用の小さいサムネイル(コンテンツ種別バッジのみ、投稿者タグは省略してコンパクトに)
  function buildThumbLink(item) {
    const link = document.createElement('a');
    link.href = '/?v=' + encodeURIComponent(item.id);
    link.className = 'block aspect-square rounded-lg overflow-hidden bg-gray-100 relative';

    const img = document.createElement('img');
    img.src = item.thumbnailUrl || '/og-image';
    img.loading = 'lazy';
    img.className = 'w-full h-full object-cover';
    img.alt = '';
    link.appendChild(img);

    const badge = document.createElement('span');
    badge.className = 'absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded';
    badge.textContent = item.contentType === 'image' ? '画像' : '動画';
    link.appendChild(badge);

    return link;
  }

  // ピックアップの横スクロール帯用。grid-cols-3で幅が決まる通常のサムネイルと違い、
  // flexの中で固定幅を持たせる必要がある(shrink-0)。
  function buildMarqueeThumb(item) {
    const link = buildThumbLink(item);
    link.className = 'block w-24 aspect-square rounded-lg overflow-hidden bg-gray-100 relative shrink-0';
    return link;
  }

  const PICKUP_SECONDS_PER_ITEM = 2.2; // 1件あたりの表示時間の目安(件数が増えても体感速度を揃える)
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ピックアップ帯の中身を差し替える。シームレスにループさせるため、同じ並びを
  // (視差効果を減らす設定でなければ)もう1セット複製して並べる。
  function renderPickupTrack(items) {
    pickupTrack.innerHTML = '';
    pickupTrack.style.animation = '';
    if (!items.length) return;

    const sets = prefersReducedMotion ? [items] : [items, items];
    sets.forEach((set) => {
      set.forEach((item) => {
        pickupTrack.appendChild(buildMarqueeThumb(item));
      });
    });

    if (!prefersReducedMotion) {
      pickupTrack.style.animationDuration = (items.length * PICKUP_SECONDS_PER_ITEM) + 's';
    }
  }

  // 指で触れている間・マウスホバー中はアニメーションを一時停止する(読みたいのに
  // 動き続けて選びにくい、という状態を避けるため)。クラス経由でanimation-play-state
  // を切り替えると実際には一時停止しない場合があったため、インラインスタイルで
  // 直接制御する。
  ['pointerdown', 'mouseenter', 'touchstart'].forEach((evt) => {
    pickupTrack.addEventListener(evt, () => { pickupTrack.style.animationPlayState = 'paused'; }, { passive: true });
  });
  ['pointerup', 'mouseleave', 'touchend', 'touchcancel'].forEach((evt) => {
    pickupTrack.addEventListener(evt, () => { pickupTrack.style.animationPlayState = 'running'; }, { passive: true });
  });

  // 新着一覧の1記事分のカード。上に投稿者名タグ+日付、下に大きめのサムネイル。
  function buildPostCard(item) {
    const card = document.createElement('article');
    card.className = 'card rounded-2xl overflow-hidden flex flex-col';

    const meta = document.createElement('div');
    meta.className = 'flex items-center justify-between gap-2 px-3 py-2';

    if (item.ownerCreatorId && item.creatorDisplayName) {
      // 投稿者名タグ。押すとその投稿者の一覧(/creator-posts/<id>)に飛ぶ。
      const tag = document.createElement('a');
      tag.href = '/creator-posts/' + encodeURIComponent(item.ownerCreatorId);
      tag.className = 'text-xs font-bold text-teal-700 truncate hover:underline';
      tag.textContent = item.creatorDisplayName;
      meta.appendChild(tag);
    } else {
      meta.appendChild(document.createElement('span'));
    }

    const date = document.createElement('span');
    date.className = 'text-[11px] text-slate-400 shrink-0';
    date.textContent = (item.uploadedAt || '').slice(0, 10);
    meta.appendChild(date);

    card.appendChild(meta);

    const link = document.createElement('a');
    link.href = '/?v=' + encodeURIComponent(item.id);
    link.className = 'block aspect-video overflow-hidden bg-gray-100 relative';

    const img = document.createElement('img');
    img.src = item.thumbnailUrl || '/og-image';
    img.loading = 'lazy';
    img.className = 'w-full h-full object-cover';
    img.alt = '';
    link.appendChild(img);

    const badge = document.createElement('span');
    badge.className = 'absolute bottom-1.5 right-1.5 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded';
    badge.textContent = item.contentType === 'image' ? '画像' : '動画';
    link.appendChild(badge);

    card.appendChild(link);
    return card;
  }

  // 視聴ページ(index.html)と同じバナー広告。PC/スマホでゾーンID・タグが異なるため、
  // 判定した方の<ins>だけを生成する。
  function loadTopAd() {
    fetch('/site-config', { cache: 'no-store' })
      .then((res) => res.json())
      .then((info) => {
        const isDesktopAd = window.matchMedia(CONTENT_PAGE_AD_DESKTOP_QUERY).matches;
        const zoneId = isDesktopAd ? info.contentPageAdZoneIdDesktop : info.contentPageAdZoneIdMobile;
        if (!zoneId) return;
        const ins = document.createElement('ins');
        ins.className = isDesktopAd ? 'eas6a97888e17' : 'eas6a97888e14';
        ins.setAttribute('data-zoneid', zoneId);
        topAdWrap.innerHTML = '';
        topAdWrap.appendChild(ins);
        topAdWrap.classList.remove('hidden-el');
        (window.AdProvider = window.AdProvider || []).push({ serve: {} });
      })
      .catch(() => {});
  }
  loadTopAd();

  // 無限スクロール。offsetを進めながら/api/top-postsを叩き、末尾に追記していく。
  let offset = 0;
  let hasMore = true;
  let isLoading = false;
  // 検索・絞り込み状態。タグ等の分類データが無いため、投稿者名の部分一致と
  // 種別(動画/画像)のみ。
  let searchQuery = '';
  let contentTypeFilter = '';

  function buildQueryString() {
    const params = new URLSearchParams({ offset: String(offset), limit: String(PAGE_SIZE) });
    if (searchQuery) params.set('q', searchQuery);
    if (contentTypeFilter) params.set('contentType', contentTypeFilter);
    return params.toString();
  }

  function loadNextPage() {
    if (isLoading || !hasMore) return;
    isLoading = true;
    loadMoreSentinel.classList.remove('hidden-el');

    fetch('/api/top-posts?' + buildQueryString(), { cache: 'no-store' })
      .then((res) => res.json())
      .then((data) => {
        loadingText.classList.add('hidden-el');
        const items = (data && data.items) || [];
        const pickup = (data && data.pickup) || null;

        if (pickup && pickup.length) {
          pickupSection.classList.remove('hidden-el');
          renderPickupTrack(pickup);
        }

        if (offset === 0 && !items.length) {
          emptyText.classList.remove('hidden-el');
        }

        items.forEach((item) => {
          postsGrid.appendChild(buildPostCard(item));
        });

        offset += items.length;
        hasMore = Boolean(data && data.hasMore);
        isLoading = false;
        loadMoreSentinel.classList.add('hidden-el');
        if (!hasMore) {
          observer.disconnect();
        }
      })
      .catch(() => {
        loadingText.classList.add('hidden-el');
        loadMoreSentinel.classList.add('hidden-el');
        isLoading = false;
        if (offset === 0) emptyText.classList.remove('hidden-el');
      });
  }

  const observer = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting)) loadNextPage();
  });
  observer.observe(loadMoreSentinel);

  // 検索語・種別のどちらかが変わったら、一覧を最初からやり直す。
  function resetAndReload() {
    const isFiltered = Boolean(searchQuery || contentTypeFilter);

    offset = 0;
    hasMore = true;
    isLoading = false;
    postsGrid.innerHTML = '';
    renderPickupTrack([]);
    // 検索結果とランダムピックアップが混ざると分かりにくいため、絞り込み中は隠す
    // (サーバー側も絞り込み中はpickupを返さない)。
    pickupSection.classList.toggle('hidden-el', isFiltered);
    emptyText.classList.add('hidden-el');
    loadingText.classList.remove('hidden-el');
    feedHeading.textContent = isFiltered ? '🔍 検索結果 🔍' : '🆕 新着 🆕';

    observer.observe(loadMoreSentinel); // disconnect()済みでも再度呼べば復帰する
    loadNextPage();
  }

  let searchDebounceId = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounceId);
    searchDebounceId = setTimeout(() => {
      searchQuery = searchInput.value.trim();
      resetAndReload();
    }, 300);
  });

  typeFilterBtns.forEach((btn) => {
    if (btn.dataset.type === contentTypeFilter) btn.classList.add('active');
    btn.addEventListener('click', () => {
      if (btn.dataset.type === contentTypeFilter) return;
      contentTypeFilter = btn.dataset.type;
      typeFilterBtns.forEach((b) => b.classList.toggle('active', b === btn));
      resetAndReload();
    });
  });

  loadNextPage();
})();
</script>

<style>
  .hidden-el{ display:none !important; }
</style>

</body>
</html>
