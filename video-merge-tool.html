<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>動画結合ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-teal:#7fccc0;
    --accent-teal-dark:#4a9d90;
    --bg-page:#faf3ea;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    background:var(--bg-page);
    color:#333;
    font-family:'Noto Sans JP',sans-serif;
  }
  body{
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .wrap{ width:100%; max-width:480px; }
  h1{
    font-family:'Outfit','Noto Sans JP',sans-serif;
    font-weight:800;
    font-size:22px;
    color:#222;
    margin:0 0 4px;
  }
  .sub{
    font-size:12px;
    color:#94a3b8;
    margin:0 0 24px;
  }
  .card{
    background:#ffffff;
    border:1px solid #efe6d8;
    box-shadow:0 4px 20px rgba(120,90,50,0.08);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-size:14px;
    margin:0 0 12px;
    color:#333;
  }
  input[type="file"]{
    font-size:13px;
    width:100%;
  }
  .file-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid #f4efe6;
    font-size:12px;
  }
  .file-row:last-child{ border-bottom:none; }
  .file-thumb{
    width:44px;
    height:44px;
    flex-shrink:0;
    border-radius:6px;
    background:#f0e9dd;
    object-fit:cover;
  }
  .file-name{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#555;
  }
  .file-row button{
    border:1px solid #e2e8f0;
    background:#fff;
    border-radius:6px;
    width:28px;
    height:28px;
    font-size:12px;
    color:#64748b;
    cursor:pointer;
  }
  .file-row button:hover{ background:#f8fafc; }
  .btn-primary{
    display:block;
    width:100%;
    background:linear-gradient(180deg,var(--accent-teal),var(--accent-teal-dark));
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  .status{
    font-size:12px;
    color:#94a3b8;
    margin-top:12px;
    white-space:pre-line;
  }
  .progress-track{
    width:100%;
    height:8px;
    border-radius:4px;
    background:#f0e9dd;
    overflow:hidden;
    margin-top:10px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent-teal),var(--accent-teal-dark));
    transition:width .2s ease;
  }
  video{
    width:100%;
    border-radius:12px;
    margin-top:12px;
    display:block;
  }
  a.download-btn{
    display:block;
    text-align:center;
    margin-top:10px;
    background:#ece3d6;
    color:#333;
    text-decoration:none;
    border-radius:10px;
    padding:12px;
    font-size:13px;
    font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>動画結合ツール</h1>
  <p class="sub">
    複数の短い動画を1本にまとめます。すべての処理はこのブラウザの中だけで行われ、
    どこにもアップロードされません。<br>
    ※同じスマホ・同じ画質・同じ形式で撮影されたクリップを想定しています。
    形式がバラバラだと結合に失敗する場合があります。
  </p>

  <div class="card">
    <h2>1. 動画を選ぶ（複数選択可）</h2>
    <input id="fileInput" type="file" accept="video/*" multiple>
    <div id="fileList"></div>
  </div>

  <div class="card">
    <h2>2. 結合する</h2>
    <button id="mergeBtn" class="btn-primary" disabled>動画を選んでください</button>
    <div id="progressTrack" class="progress-track" style="display:none;">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <p id="statusText" class="status"></p>
    <video id="resultVideo" style="display:none;" controls></video>
    <a id="downloadLink" class="download-btn" style="display:none;" download="merged.mp4">結合した動画をダウンロード</a>
  </div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
(function () {
  // ffmpeg.wasm 0.11系のシンプルなAPI(createFFmpeg)を使う。
  // 0.12系のESM+Worker構成はCDN直読み込み(バンドラー無し)だと
  // Worker内の相対importが壊れてload()が固まることがあるため、
  // こちらの旧APIの方がこの用途(ビルド無しの1枚のHTML)には向いている。
  const { createFFmpeg, fetchFile } = FFmpeg;

  const fileInput   = document.getElementById('fileInput');
  const fileListEl  = document.getElementById('fileList');
  const mergeBtn    = document.getElementById('mergeBtn');
  const statusText  = document.getElementById('statusText');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill  = document.getElementById('progressFill');
  const resultVideo = document.getElementById('resultVideo');
  const downloadLink = document.getElementById('downloadLink');

  let files = [];

  fileInput.addEventListener('change', () => {
    files = files.concat(Array.from(fileInput.files));
    fileInput.value = '';
    renderFileList();
  });

  const thumbCache = new WeakMap();

  function captureThumbnail(file, imgEl) {
    const video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.preload = 'metadata';
    const objectUrl = URL.createObjectURL(file);
    video.src = objectUrl;

    const cleanup = () => URL.revokeObjectURL(objectUrl);

    function draw() {
      const canvas = document.createElement('canvas');
      canvas.width = 88;
      canvas.height = 88;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
      const w = video.videoWidth * scale;
      const h = video.videoHeight * scale;
      ctx.drawImage(video, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      thumbCache.set(file, dataUrl);
      imgEl.src = dataUrl;
      cleanup();
    }

    video.addEventListener('loadeddata', () => {
      // 動画冒頭が暗転/真っ暗なことが多いため、少し進めた位置のフレームを使う
      const seekTo = Math.min(0.5, video.duration / 2 || 0);
      if (seekTo > 0) {
        video.addEventListener('seeked', draw, { once: true });
        video.currentTime = seekTo;
      } else {
        draw();
      }
    }, { once: true });

    video.addEventListener('error', cleanup, { once: true });
  }

  function renderFileList() {
    fileListEl.innerHTML = '';
    files.forEach((file, index) => {
      const row = document.createElement('div');
      row.className = 'file-row';

      const thumb = document.createElement('img');
      thumb.className = 'file-thumb';
      thumb.alt = '';
      row.appendChild(thumb);
      if (thumbCache.has(file)) {
        thumb.src = thumbCache.get(file);
      } else {
        captureThumbnail(file, thumb);
      }

      const name = document.createElement('span');
      name.className = 'file-name';
      name.textContent = (index + 1) + '. ' + file.name;
      row.appendChild(name);

      const upBtn = document.createElement('button');
      upBtn.type = 'button';
      upBtn.textContent = '↑';
      upBtn.disabled = index === 0;
      upBtn.addEventListener('click', () => {
        [files[index - 1], files[index]] = [files[index], files[index - 1]];
        renderFileList();
      });
      row.appendChild(upBtn);

      const downBtn = document.createElement('button');
      downBtn.type = 'button';
      downBtn.textContent = '↓';
      downBtn.disabled = index === files.length - 1;
      downBtn.addEventListener('click', () => {
        [files[index], files[index + 1]] = [files[index + 1], files[index]];
        renderFileList();
      });
      row.appendChild(downBtn);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', () => {
        files.splice(index, 1);
        renderFileList();
      });
      row.appendChild(removeBtn);

      fileListEl.appendChild(row);
    });

    if (files.length >= 2) {
      mergeBtn.disabled = false;
      mergeBtn.textContent = 'この順番で結合する（' + files.length + '本）';
    } else {
      mergeBtn.disabled = true;
      mergeBtn.textContent = '動画を2本以上選んでください';
    }
  }

  let ffmpeg = null;

  mergeBtn.addEventListener('click', async () => {
    mergeBtn.disabled = true;
    resultVideo.style.display = 'none';
    downloadLink.style.display = 'none';
    progressTrack.style.display = 'block';
    progressFill.style.width = '0%';
    statusText.textContent = 'ツールを読み込み中…（初回のみ少し時間がかかります）';

    try {
      if (!ffmpeg) {
        ffmpeg = createFFmpeg({
          log: true,
          progress: ({ ratio }) => {
            const pct = Math.min(100, Math.max(0, Math.round(ratio * 100)));
            progressFill.style.width = pct + '%';
          },
        });
      }
      if (!ffmpeg.isLoaded()) {
        await ffmpeg.load();
      }

      statusText.textContent = '動画を読み込み中…';
      const names = [];
      for (let i = 0; i < files.length; i++) {
        const ext = (files[i].name.split('.').pop() || 'mp4').toLowerCase();
        const name = `input${i}.${ext}`;
        ffmpeg.FS('writeFile', name, await fetchFile(files[i]));
        names.push(name);
      }

      const listContent = names.map((n) => `file '${n}'`).join('\n');
      ffmpeg.FS('writeFile', 'list.txt', new TextEncoder().encode(listContent));

      statusText.textContent = '結合しています…';
      await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'output.mp4');

      const data = ffmpeg.FS('readFile', 'output.mp4');
      const blob = new Blob([data.buffer], { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);

      resultVideo.src = url;
      resultVideo.style.display = 'block';
      downloadLink.href = url;
      downloadLink.style.display = 'block';
      statusText.textContent = '完成しました。プレビューを確認してダウンロードしてください。';
      progressFill.style.width = '100%';
    } catch (err) {
      statusText.textContent = '結合に失敗しました。動画の形式がバラバラな可能性があります。（' + (err && err.message ? err.message : err) + '）';
    } finally {
      mergeBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
